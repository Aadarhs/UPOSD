{% extends 'base.html' %}
{% block content %}
<header class="page-head"><h1>Settings & Configuration</h1><p>Cloud-ready and Raspberry Pi oriented controls (demo).</p></header>
<section class="panel glass">
    <form>
        <label>Deployment Target</label>
        <select>
            <option>Raspberry Pi 4</option>
            <option>Docker Container</option>
            <option>Cloud VM</option>
        </select>
        <label>Logging Mode</label>
        <select>
            <option>Local SQLite + File Logs</option>
            <option>Cloud Logging (Simulation)</option>
        </select>
        <label><input type="checkbox" checked> Enable safe attack simulation mode only</label>
        <button type="button">Save Configuration</button>
    </form>
</section>
{% endblock %}
